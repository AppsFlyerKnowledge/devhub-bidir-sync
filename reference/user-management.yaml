openapi: 3.0.1
info:
  title: User management
  version: 1.0.0
servers:
  - url: https://hq1.appsflyer.com/api/user-management/v1.0
security:
  - bearerAuth: []
paths:
  /users:
    get:
      summary: Get users
      description: >
        > ⚠️ Important

        >

        > All API V2 tokens generated before March 10, 2026, 19:00 UTC have been
        revoked. If your token was generated before this date, please regenerate
        it. [Learn
        how](https://support.appsflyer.com/hc/en-us/articles/360004562377-Managing-AppsFlyer-tokens).


        Retrieve users data for the specified account.
      tags:
        - Managing users in bulk
      operationId: bulk-users-get
      responses:
        '200':
          description: Successful response containing the list of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                          description: The username of the user.
                        email:
                          type: string
                          description: The email of the user.
                        role:
                          type: string
                          description: The role of the user.
                        apps:
                          type: string
                          description: The apps associated with the user.
                        media_sources:
                          type: string
                          description: The media sources associated with the user.
                        geos:
                          type: string
                          description: The geos associated with the user.
                        last_login:
                          type: string
                          description: The last login timestamp of the user.
        '400':
          description: Bad request - Invalid input or exceeded limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message for a bad request
        '401':
          description: Unauthorized - Missing or insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message for unauthorized access
  /users/{userIds}:
    delete:
      summary: Delete users
      description: >
        > ⚠️ Important

        >

        > All API V2 tokens generated before March 10, 2026, 19:00 UTC have been
        revoked. If your token was generated before this date, please regenerate
        it. [Learn
        how](https://support.appsflyer.com/hc/en-us/articles/360004562377-Managing-AppsFlyer-tokens).


        Delete multiple users for the specified account.
      tags:
        - Managing users in bulk
      operationId: bulk-users-delete
      parameters:
        - in: path
          name: userIds
          description: Comma-separated list of user IDs to delete
          required: true
          schema:
            type: string
            example: user1@company.com,user2@company.com
      responses:
        '204':
          description: Users deleted successfully
        '400':
          description: Bad request - Invalid input format
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message for a bad request
        '401':
          description: Unauthorized - Missing or insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message for unauthorized access
        '422':
          description: Unprocessable Entity - Invalid input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message for an unprocessable entity
  /roles: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        **Important: API V2 Token Revocation**


        All API V2 tokens generated before March 10, 2026, 19:00 UTC have been
        revoked. If your token was generated before this date, please regenerate
        it. [Learn
        how](https://support.appsflyer.com/hc/en-us/articles/360004562377-Managing-AppsFlyer-tokens).


        Authorization HTTP header containing API V2 token (bearer token) is
        required.

         The admin [gets the V2 token in the dashboard](https://support.appsflyer.com/hc/en-us/articles/360004562377)
